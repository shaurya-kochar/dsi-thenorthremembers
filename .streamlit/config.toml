# Theme for the InfoBridge demo app (app.py).
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#EEF0F7"
textColor = "#1E2333"
borderColor = "#E2E5EF"
linkColor = "#4F46E5"
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4FA"

[client]
toolbarMode = "minimal"
